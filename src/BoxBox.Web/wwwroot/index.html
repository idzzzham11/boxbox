<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxBox</title>
    <!-- The app is served from the site root, so every relative URL below resolves against "/". -->
    <base href="/" />
    <meta name="theme-color" content="#d9322b" />
    <!-- Home-screen install: the manifest (Android/Chrome) and the Apple tags (iPhone Safari). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BoxBox" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app"><p style="font:16px system-ui;padding:16px;color:#6a7280">Loading BoxBox…</p></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
