<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoxBox</title>
    <!-- The app is served under /next/, so every relative URL below resolves against this base. -->
    <base href="/next/" />
    <meta name="theme-color" content="#d9322b" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app"><p style="font:16px system-ui;padding:16px;color:#6a7280">Loading BoxBox…</p></div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
